# The site lives in /fleet/ under the web root, so the proxy can pass paths through unchanged.
# A request for /fleet gets nginx's directory redirect to /fleet/, which the site's relative links need.
# /fleet/changelog/ is a directory index (site/changelog/index.html), and /fleet/changelog redirects to it the same way.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Behind a TLS-terminating proxy: keep redirects relative so they stay on https.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        return 302 /fleet/;
    }

    location /fleet/ {
        try_files $uri $uri/ =404;
    }

    location ~* \.(woff2|png)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }
}
