name: pages

on:
  push:
    branches: [main]
    paths: [".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The landing page lives at rolflab.nl/fleet (deploy/Dockerfile). Pages only redirects there,
      # keeping the #section of old links, so the old address keeps working.
      - name: Write the redirect
        run: |
          set -eu
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>fleet has moved to rolflab.nl/fleet</title>
            <link rel="canonical" href="https://rolflab.nl/fleet/">
            <meta http-equiv="refresh" content="0; url=https://rolflab.nl/fleet/">
            <script>location.replace('https://rolflab.nl/fleet/' + location.hash);</script>
          </head>
          <body>
            <p>fleet's site has moved to <a href="https://rolflab.nl/fleet/">rolflab.nl/fleet</a>.</p>
          </body>
          </html>
          HTML
          cp _site/index.html _site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
