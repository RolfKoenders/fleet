name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "src/tui/**", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The frames come from the real TUI, so the page always shows the bridge as it is on main.
      - run: npm run site
      - name: Assemble the site
        run: |
          set -eu
          mkdir -p _site
          cp site/index.html site/style.css site/main.js site/frames.js _site/
          cp assets/social-preview.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
