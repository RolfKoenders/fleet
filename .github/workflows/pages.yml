name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "assets/social-preview.png", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The site is static: frames.js holds frames recorded from the TUI, so nothing here builds or imports it.
      - name: Assemble the site
        run: |
          set -eu
          mkdir -p _site
          cp -r site/. _site/
          cp assets/social-preview.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
