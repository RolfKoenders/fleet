name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # What the change can break, from the files it touches:
  #   docs: only files nothing builds or tests (deploy/, assets/, docs/, the pages workflow, ...): no tests.
  #   site: those plus the landing page (site/), whose tests read index.html and main.js: only the site tests.
  #   code: anything else, including README, CHANGELOG and GLOSSARY, which tests read: everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.diff.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          docs='^(deploy/|assets/|docs/|\.github/workflows/pages\.yml$|LICENSE$|AGENTS\.md$|CLAUDE\.md$)'
          site='^site/'
          scope=code
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
            if [ -n "$files" ]; then
              if ! printf '%s\n' "$files" | grep -qvE "$docs"; then
                scope=docs
              # site/frames.js is recorded from the bridge and a test compares the two, so it is code.
              elif ! printf '%s\n' "$files" | grep -qvE "$docs|$site" && ! printf '%s\n' "$files" | grep -qxF site/frames.js; then
                scope=site
              fi
            fi
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          printf 'scope=%s\n%s\n' "$scope" "${files:-}"

  # test (22.18) and test (24) are required checks, so they always run: with no steps for docs,
  # with only the site tests for site, and with everything for code.
  test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.18", "24", "26"]
    env:
      SCOPE: ${{ needs.changes.outputs.scope }}
    steps:
      - if: env.SCOPE == 'docs'
        run: echo "Nothing that is built or tested changed."
      - if: env.SCOPE != 'docs'
        uses: actions/checkout@v4
      - if: env.SCOPE != 'docs'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - if: env.SCOPE == 'site'
        run: npm ci
      - if: env.SCOPE == 'site'
        run: node --test test/site-frames.test.ts test/site-changelog.test.ts
      - name: Install sops and age
        if: env.SCOPE == 'code'
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          curl -fsSLO https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          curl -fsSLO https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          cat > sums <<'EOF'
          e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  sops-v3.13.3.linux.amd64
          cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  age-v1.3.2-linux-amd64.tar.gz
          EOF
          sha256sum -c sums
          install -m 755 sops-v3.13.3.linux.amd64 "$HOME/.local/bin/sops"
          tar -xzf age-v1.3.2-linux-amd64.tar.gz age/age-keygen
          install -m 755 age/age-keygen "$HOME/.local/bin/age-keygen"
      - if: env.SCOPE == 'code'
        run: npm ci
      - if: env.SCOPE == 'code'
        run: npx tsc --noEmit
      - if: env.SCOPE == 'code'
        run: npm test

  # Apple Silicon is macos-latest, Intel is macos-15-intel. Not required, so it runs for code changes only.
  test-macos:
    name: test (macOS)
    needs: changes
    if: needs.changes.outputs.scope == 'code'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install sops and age
        run: brew install sops age
      - name: Show the tools the tests will use
        run: |
          uname -sm
          command -v sops age-keygen node
          sops --version --disable-version-check
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
