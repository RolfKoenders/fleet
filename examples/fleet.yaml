# The fleet tool version every machine runs.
#
# Fleet does not run whatever is newest. Each `fleet apply` checks out `commit` in the
# machine's fleet clone (~/.local/share/fleet/fleet) and runs that code, so a change to the
# tool reaches your machines only after you have moved this line and pushed.
#
# `fleet new` filled in the three values below. To take a newer tool, run `fleet update`: it
# moves `commit` as `track` says and changes nothing else. Read the change with `git diff`,
# then `fleet push`.
tool:
  # Where machines clone the tool from. A plain URL: no password in it.
  repo: https://github.com/example/fleet.git
  # The full 40-character commit that machines run.
  commit: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  # What `fleet update` follows. `releases` moves `commit` to the newest release (the highest
  # vX.Y.Z tag), so you take finished versions only. Any other value is a branch, such as
  # `main`, and `commit` moves to its latest commit, which is what the tool's developers use.
  track: releases
