<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fleet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="logo"><i></i>fleet <span>ui</span></div>
    <div class="repo" id="repo"></div>
    <div class="spacer"></div>
    <span class="tag" id="link" title="The live connection to fleet ui">connecting</span>
    <span class="local" id="local" title="Bound to 127.0.0.1 only. The URL carries a random token.">only this machine</span>
    <a class="tray none" id="tray" href="#/review"><span>Held</span><b id="trayn">0</b></a>
  </header>
  <nav class="side" id="side">
    <a href="#/matrix" data-r="matrix"><span class="ic">▦</span>Matrix</a>
    <a href="#/catalog" data-r="catalog"><span class="ic">⇄</span>Catalog</a>
    <a href="#/hosts" data-r="hosts"><span class="ic">▤</span>Hosts</a>
    <a href="#/secrets" data-r="secrets"><span class="ic">⚿</span>Secrets</a>
    <hr>
    <a href="#/status" data-r="status"><span class="ic">●</span>Status</a>
    <a href="#/review" data-r="review"><span class="ic">↑</span>Review &amp; push<span class="count" id="sidecount"></span></a>
    <div class="foot">Nothing is written to disk until you push. Ctrl-c in the terminal stops fleet ui.</div>
  </nav>
  <main id="main"></main>
</div>
<noscript>fleet ui needs JavaScript.</noscript>
</body>
</html>
