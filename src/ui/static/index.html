<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fleet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <a class="logo" href="#/matrix" aria-label="fleet ui"><svg viewBox="0 0 120 84" aria-hidden="true"><path d="M8 20h22l10 10v32H8Z" fill="none" stroke="#3fb950" stroke-width="5"/><path d="M15 38h18M15 46h18M15 54h11" stroke="#3fb950" stroke-width="4"/><path d="M40 42C62 42 62 16 84 16M40 42H84M40 42C62 42 62 68 84 68" fill="none" stroke="#7d8590" stroke-width="4"/><g fill="none" stroke="#e6edf3" stroke-width="4"><rect x="84" y="9" width="32" height="14" rx="2"/><rect x="84" y="35" width="32" height="14" rx="2"/><rect x="84" y="61" width="32" height="14" rx="2"/></g></svg>fleet <span>ui</span></a>
    <div class="repo" id="repo"></div>
    <div class="spacer"></div>
    <span class="tag" id="jobs" hidden></span>
    <span class="tag" id="link" title="The live connection to fleet ui">connecting</span>
    <span class="local" id="local" title="Bound to 127.0.0.1 only. The URL carries a random token.">only this machine</span>
    <a class="tray none" id="tray" href="#/review"><span>To push</span><b id="trayn">0</b></a>
  </header>
  <nav class="side" id="side">
    <a href="#/matrix" data-r="matrix"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></span>Matrix</a>
    <a href="#/catalog" data-r="catalog"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg></span>Catalog</a>
    <a href="#/hosts" data-r="hosts"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg></span>Hosts</a>
    <a href="#/secrets" data-r="secrets"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/></svg></span>Secrets<span class="count warn" id="secretcount"></span></a>
    <hr>
    <a href="#/review" data-r="review"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg></span>Review &amp; push<span class="count" id="sidecount"></span></a>
    <a href="#/status" data-r="status"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></span>Status</a>
    <div class="foot">Nothing is written to disk until you push. Ctrl-c in the terminal stops fleet ui.</div>
  </nav>
  <main id="main"></main>
</div>
<template id="ic-file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6v18h12V7Z"/><path d="M14 3v4h4"/></svg></template>
<noscript>fleet ui needs JavaScript.</noscript>
</body>
</html>
