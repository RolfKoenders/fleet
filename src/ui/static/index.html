<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fleet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<h1>fleet</h1>
<pre id="out">connecting...</pre>
<script>
  // The token is in the fragment, so it is never sent to the server by the browser's own requests. It is kept in
  // memory and sent as a header on every API call. EventSource cannot send headers, so the stream takes it as a query.
  const token = new URLSearchParams(location.hash.slice(1)).get("t");
  const out = document.getElementById("out");
  if (token === null) {
    out.textContent = "open the URL that 'fleet ui' printed, including the part after #";
  } else {
    history.replaceState(null, "", location.pathname);
    const lines = [];
    const show = (line) => {
      lines.push(line);
      out.textContent = lines.slice(-40).join("\n");
    };
    fetch("/api/status", { headers: { "X-Fleet-Token": token } })
      .then((r) => r.json())
      .then((doc) => show("status: " + JSON.stringify(doc, null, 2)))
      .catch((e) => show("status failed: " + e.message));
    const stream = new EventSource("/api/events?token=" + encodeURIComponent(token));
    stream.addEventListener("hello", () => show("connected"));
    stream.addEventListener("push", (e) => show("push: " + e.data));
    stream.addEventListener("pushend", (e) => show("push ended: " + e.data));
    stream.onerror = () => show("stream closed");
  }
</script>
</body>
</html>
